[project]
name = "felis-ai-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for felis-ai-chatbot (pgvector RAG chatbot)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32",
]

# アプリはパッケージとして配布しないため、uv にビルド不要と明示する
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# async テストを明示デコレータなしで書けるようにする
asyncio_mode = "auto"
markers = [
    "db: TEST_DATABASE_URL の PostgreSQL(pgvector) を使うテスト（未設定なら skip）",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]
