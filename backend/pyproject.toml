[project]
name = "felis-ai-chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for felis-ai-chatbot (pgvector RAG chatbot)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "uvicorn[standard]>=0.32",
]

# アプリはパッケージとして配布しないため、uv にビルド不要と明示する
[tool.uv]
package = false
