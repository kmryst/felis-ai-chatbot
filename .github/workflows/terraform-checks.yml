# Terraform Format & Validate
# 目的: terraform/ 配下のフォーマットと構文・スキーマ整合を PR ごとに検査する。
# apply / plan は行わない（Azure 資格情報を使わない静的検査のみ）。
#
# TERRAFORM_VERSION はローカル正本 .mise.toml の terraform と一致させること。
# 一致は toolchain-version-check.yml（idp-golden-path の reusable workflow）が機械検査する。
#
# init は -backend=false で実行する。backend "azurerm" の実体（tfstate Storage Account）が
# なくても provider スキーマ検証まで行うため。

name: Terraform Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-checks.yml"
      - ".mise.toml"

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: "1.14.8"

jobs:
  terraform-checks:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: Terraform Init & Validate (all root modules)
        run: |
          set -e
          for dir in terraform/persistent; do
            echo "--- $dir ---"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
