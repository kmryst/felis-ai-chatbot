version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  # backend（FastAPI）。uv は Dependabot GA サポート済み（2025-03-13 Changelog）
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      backend-prod:
        dependency-type: "production"
        patterns:
          - "*"
      backend-dev:
        dependency-type: "development"
        patterns:
          - "*"

  # frontend（Next.js）。実行時依存が拾われるよう prod / dev でグループを分ける
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    # typescript-eslint が TS 7 未対応（eslint-config-next 経由で hard error）のため、
    # typescript のメジャー更新のみ一時 ignore。解除条件と追跡は Issue #28
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-prod:
        dependency-type: "production"
        patterns:
          - "*"
      frontend-dev:
        dependency-type: "development"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    groups:
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
